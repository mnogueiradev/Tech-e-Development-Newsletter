<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Obrigado pelo seu feedback! — Techndevn Newsletter</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 48px 36px;
            max-width: 440px;
            text-align: center;
        }
        .icon-box {
            width: 72 h-72;
            height: 72px;
            width: 72px;
            background-color: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            color: #3b82f6;
        }
        .icon-box svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">
            <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        <h1>Obrigado pelo seu feedback!</h1>
        <p>Sua avaliação ajuda nosso algoritmo de curadoria a selecionar notícias cada vez mais relevantes para você.</p>
        <a href="https://techndevn.com" class="btn">Voltar para o site</a>
    </div>
</body>
</html>
